[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-policy-adapter"
version = "0.1.3"
description = "Private DreamClient adapter for Colosseum YAM policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "httpx>=0.27", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."colosseum_policy_server.model_adapters"]
dream_yam = "dream_policy_adapter.adapter:create_adapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
